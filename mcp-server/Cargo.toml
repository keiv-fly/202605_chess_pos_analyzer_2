[package]
name = "chess-pos-analyzer"
version = "0.1.0"
edition = "2021"
description = "Local MCP server exposing a chess board and Stockfish analysis"

[[bin]]
name = "chess-pos-analyzer"
path = "src/main.rs"

[lib]
name = "chess_pos_analyzer"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "0.8.5", features = ["server", "macros", "transport-io"] }
shakmaty = "0.27"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
lru = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
